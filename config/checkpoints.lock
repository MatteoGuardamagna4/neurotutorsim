{
  "_comment": [
    "Checksum lock for TRIBE v2 checkpoint files (brief \u00a76.1 items 11-13).",
    "Keys are '<repo_id>@<40-hex revision>'. Values map a repo-relative file",
    "path to its sha256. verify_checkpoint() downloads the pinned revision,",
    "recomputes each hash, and raises on any mismatch or missing entry.",
    "",
    "The entry below was recorded on 2026-07-29 and must match the revision",
    "pinned in config/tribe.yaml -- tests/test_tribe_config.py fails if the two",
    "drift apart. facebook/tribev2 is not gated (only its Llama-3.2-3B encoder",
    "is), so --write-lock needs no GPU and no approved access: it downloads and",
    "hashes, it never loads a model.",
    "",
    "To move the pin to another revision:",
    "  python scripts/run_tribe_verification.py --config config/tribe.yaml \\",
    "      --resolve-revision            # prints the Hub's current SHA",
    "  python scripts/run_tribe_verification.py --config config/tribe.yaml \\",
    "      --write-lock                  # records checksums for that revision",
    "",
    "--write-lock is deliberately a separate, explicit opt-in: recording a",
    "checksum you have not verified turns the lock into a rubber stamp. It also",
    "refuses to overwrite an existing entry, so a re-pin is a decision about the",
    "old one too."
  ],
